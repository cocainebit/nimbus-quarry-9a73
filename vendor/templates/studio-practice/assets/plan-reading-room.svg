<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Plan of the Reading Room">
  <rect width="1200" height="800" fill="#f0ece4"/>
  <g fill="none" stroke="#3d5265" stroke-width="1.5" stroke-linecap="round">
    <!-- the green: boundary and path -->
    <path d="M80 720 H1120" stroke-dasharray="10 8"/>
    <path d="M600 660 V720" stroke-width="1"/>
    <path d="M586 660 V720 M614 660 V720" stroke-width="1" opacity=".5"/>
    <!-- roof slots shown dashed over the plan -->
    <g stroke-dasharray="6 6" opacity=".7">
      <path d="M330 200 V600 M430 200 V600 M530 200 V600 M630 200 V600 M730 200 V600 M830 200 V600"/>
    </g>
    <!-- shelving along the long walls -->
    <g stroke-width="1">
      <path d="M262 200 V600 M290 200 V600"/>
      <path d="M262 230 H290 M262 260 H290 M262 290 H290 M262 320 H290 M262 350 H290 M262 380 H290 M262 410 H290 M262 440 H290 M262 470 H290 M262 500 H290 M262 530 H290 M262 560 H290"/>
      <path d="M910 200 V600 M938 200 V600"/>
      <path d="M910 230 H938 M910 260 H938 M910 290 H938 M910 320 H938 M910 350 H938 M910 380 H938 M910 410 H938 M910 440 H938 M910 470 H938 M910 500 H938 M910 530 H938 M910 560 H938"/>
    </g>
    <!-- reading tables -->
    <rect x="360" y="270" width="480" height="44" rx="2"/>
    <rect x="360" y="378" width="480" height="44" rx="2"/>
    <rect x="360" y="486" width="480" height="44" rx="2"/>
    <!-- chairs -->
    <g stroke-width="1.2">
      <circle cx="400" cy="250" r="9"/><circle cx="480" cy="250" r="9"/><circle cx="560" cy="250" r="9"/><circle cx="640" cy="250" r="9"/><circle cx="720" cy="250" r="9"/><circle cx="800" cy="250" r="9"/>
      <circle cx="400" cy="334" r="9"/><circle cx="480" cy="334" r="9"/><circle cx="560" cy="334" r="9"/><circle cx="640" cy="334" r="9"/><circle cx="720" cy="334" r="9"/><circle cx="800" cy="334" r="9"/>
      <circle cx="400" cy="358" r="9"/><circle cx="480" cy="358" r="9"/><circle cx="560" cy="358" r="9"/><circle cx="640" cy="358" r="9"/><circle cx="720" cy="358" r="9"/><circle cx="800" cy="358" r="9"/>
      <circle cx="400" cy="442" r="9"/><circle cx="480" cy="442" r="9"/><circle cx="560" cy="442" r="9"/><circle cx="640" cy="442" r="9"/><circle cx="720" cy="442" r="9"/><circle cx="800" cy="442" r="9"/>
      <circle cx="400" cy="466" r="9"/><circle cx="480" cy="466" r="9"/><circle cx="560" cy="466" r="9"/><circle cx="640" cy="466" r="9"/><circle cx="720" cy="466" r="9"/><circle cx="800" cy="466" r="9"/>
      <circle cx="400" cy="550" r="9"/><circle cx="480" cy="550" r="9"/><circle cx="560" cy="550" r="9"/><circle cx="640" cy="550" r="9"/>
    </g>
    <!-- desk by the door -->
    <rect x="720" y="548" width="120" height="30"/>
    <circle cx="780" cy="530" r="9" stroke-width="1.2"/>
    <!-- porch: columns and low roof line -->
    <path d="M480 612 H720" stroke-width="1"/>
    <path d="M480 660 H720"/>
    <g fill="#1f1c18" stroke="none">
      <rect x="484" y="654" width="12" height="12"/>
      <rect x="594" y="654" width="12" height="12"/>
      <rect x="704" y="654" width="12" height="12"/>
    </g>
    <!-- door swing -->
    <path d="M560 612 A56 56 0 0 1 616 556"/>
    <!-- north arrow -->
    <circle cx="1080" cy="80" r="22"/>
    <path d="M1080 102 V58"/>
    <path d="M1080 58 L1070 76 L1080 70 L1090 76 Z" fill="#3d5265" stroke="none"/>
    <!-- scale bar -->
    <path d="M100 660 H300"/>
    <path d="M100 654 V666 M150 654 V666 M200 654 V666 M250 654 V666 M300 654 V666"/>
  </g>
  <!-- filled walls -->
  <g fill="#1f1c18">
    <rect x="250" y="188" width="700" height="12"/>
    <rect x="250" y="600" width="230" height="12"/>
    <rect x="720" y="600" width="230" height="12"/>
    <rect x="250" y="188" width="12" height="424"/>
    <rect x="938" y="188" width="12" height="424"/>
    <rect x="100" y="660" width="50" height="6"/>
    <rect x="200" y="660" width="50" height="6"/>
  </g>
</svg>
